<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todoList</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      투두 리스트
      <div class="calendar">
        <div class="header">
          <button class="nav" id="prev" onClick="prevMonth()">이전</button>
          <button id="currentYearMonth" onClick="goCurrentYearMonth()"></button>
          <button class="nav" id="next" onClick="nextMonth()">다음</button>
        </div>
        <div class="main">
          <div class="days">
            <div class="day">일</div>
            <div class="day">월</div>
            <div class="day">화</div>
            <div class="day">수</div>
            <div class="day">목</div>
            <div class="day">금</div>
            <div class="day">토</div>
          </div>
          <div class="dates"></div>
        </div>
      </div>
      <div id="modal-root"></div>
      <script type="module" src="modal.js"></script>
      <script type="module" src="calendar.js"></script>
      <script src="script.js"></script>
    </div>
  </body>
</html>
